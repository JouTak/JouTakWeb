version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "build(deps)"

updates:
  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    ignore:
      # React and accessibility plugins do not yet support ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # New compiler rules need a separate application refactor.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    ignore:
      # Keep the image aligned with uv sync --python 3.12 and CI.
      - dependency-name: python
        versions: [">=3.13"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    ignore:
      # Major upgrades require migration of existing persistent databases.
      - dependency-name: postgres
        versions: [">=17"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
