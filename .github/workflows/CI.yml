name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit_rules:
    name: Commit rules
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|chore|refactor|docs|test|ci|build|perf|style|revert)\([a-z0-9._-]+\): .+'
          status=0

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow: type(scope): description"
            status=1
          fi

          while IFS= read -r subject; do
            if [[ "$subject" =~ ^Merge[[:space:]] ]] || [[ "$subject" =~ ^Revert\ \" ]] || [[ "$subject" =~ $pattern ]]; then
              continue
            fi
            echo "::error::Invalid commit subject: $subject"
            status=1
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")

          exit "$status"

  repository_quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA..$HEAD_SHA"
          else
            git diff-tree --check --no-commit-id --root -r "$HEAD_SHA"
          fi

  frontend_quality:
    name: Frontend ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESLint
            command: npm run lint
          - name: Prettier
            command: npm run format
          - name: Stylelint
            command: npm run lint:styles
          - name: Unit tests
            command: npm run test:run
          - name: Warning-free build
            command: npm run build
          - name: Asset budgets
            command: npm run check:assets
          - name: Generated media
            command: npm run generate:media && git diff --exit-code -- src/assets/media/generated src/media/generatedMedia.js
          - name: Production audit
            command: npm run check:audit
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  frontend_checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: frontend_quality
    if: always()
    steps:
      - name: Verify matrix status
        env:
          RESULT: ${{ needs.frontend_quality.result }}
        run: test "$RESULT" = success

  browser_smoke:
    name: Browser responsive and axe smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backend_quality:
    name: Backend quality and generated contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --group dev --group test
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Bandit
        run: >
          uv run bandit -r
          backend/accounts backend/bff backend/core backend/backend
          backend/featureflags backend/observability
          -x "*/tests/*,*/migrations/*"
          --skip B104,B105
      - name: Check generated page contract
        env:
          PYTHONPATH: backend
        run: |
          uv run python -m bff.generate_contracts
          git diff --exit-code -- contracts/page-document.schema.json
      - name: Check Django migration state
        run: uv run python backend/manage.py makemigrations --check --dry-run
      - name: Check frontend/OpenAPI contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DJANGO_SETTINGS_MODULE: backend.settings.dev
        run: uv run python scripts/check_frontend_openapi_contracts.py
      - name: Check generated requirements
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          uv export --frozen --no-dev --no-hashes -q -o "$tmp_dir/prod.txt"
          uv export --frozen --group dev --group test --no-hashes -q -o "$tmp_dir/dev.txt"
          uv export --frozen --no-default-groups --group test --no-hashes -q -o "$tmp_dir/test.txt"
          diff -u <(tail -n +3 backend/requirements/prod.txt) <(tail -n +3 "$tmp_dir/prod.txt")
          diff -u <(tail -n +3 backend/requirements/dev.txt) <(tail -n +3 "$tmp_dir/dev.txt")
          diff -u <(tail -n +3 backend/requirements/test.txt) <(tail -n +3 "$tmp_dir/test.txt")

  backend_audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.12 --group dev
      - run: |
          uv export --frozen --no-dev --no-hashes -q -o /tmp/joutak-requirements.txt
          uv run pip-audit --no-deps -r /tmp/joutak-requirements.txt

  backend_test:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      DJANGO_SETTINGS_MODULE: backend.settings.prod
      DJANGO_SECRET_KEY: test-secret-key-change-me-please-very-long-1234567890
      DATABASE_URL: sqlite:///./testdb.sqlite3
      FRONTEND_BASE_URL: https://joutak.ru
      DB_SSL_REQUIRED: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api.joutak.ru,admin.joutak.ru,api.localhost,admin.localhost
      DJANGO_ADMIN_HOSTS: admin.joutak.ru,admin.localhost
      DJANGO_API_HOSTS: api.joutak.ru,api.localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://api.localhost,http://admin.localhost,https://joutak.ru,https://api.joutak.ru,https://admin.joutak.ru
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,https://joutak.ru
      USE_X_FORWARDED_PROTO: "false"
      SECURE_SSL_REDIRECT: "false"
      SECURE_HSTS_SECONDS: "0"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: None
      CSRF_COOKIE_SAMESITE: None
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --group test
      - run: uv run python backend/manage.py check
      - run: uv run pytest backend -q

  docker_checks:
    name: Docker manifests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate zero-config development Compose
        run: |
          docker compose -f compose.yaml config >/dev/null
          docker compose --env-file .env.example -f compose.yaml config >/dev/null
      - name: Validate production Compose files
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          DJANGO_SECRET_KEY: ci-secret-key-please-change
          FRONTEND_BASE_URL: https://joutak.ru
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api.localhost,admin.localhost,api.joutak.ru,admin.joutak.ru
          DJANGO_ADMIN_HOSTS: admin.localhost,admin.joutak.ru
          DJANGO_API_HOSTS: api.localhost,api.joutak.ru
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://api.localhost,http://admin.localhost,https://joutak.ru,https://api.joutak.ru,https://admin.joutak.ru
          CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
          PUBLIC_API_URL: http://api.localhost
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.images.yml config >/dev/null
          cp .env.example .env.production
          docker compose -f stack.yml config >/dev/null
          rm -f .env.production
      - run: docker build -f ./backend/Dockerfile -t joutakweb-api:ci .
      - run: docker build -f ./frontend/Dockerfile -t joutakweb:ci .

  smoke_stack:
    name: Smoke stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Run documented zero-config development stack
        run: |
          docker compose -f compose.yaml up -d --build
          uv run python scripts/smoke_stack.py
      - name: Dump smoke stack logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color backend backend-maintenance frontend proxy db
      - name: Shutdown stack
        if: always()
        run: docker compose -f compose.yaml down -v

  secret_scan:
    name: Gitleaks 8.27.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Download and verify gitleaks
        run: |
          version=8.27.2
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$base/$checksums" --output "$checksums"
          grep "  $archive$" "$checksums" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner
