x-backend-environment: &backend-environment
  # This file is the zero-configuration development stack. Production
  # manifests keep requiring externally managed secrets and HTTPS settings.
  DJANGO_SETTINGS_MODULE: backend.settings.dev
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: ${DEV_DJANGO_SECRET_KEY:-dev-only-secret-key-not-for-production-0123456789-abcdefghijklmnopqrstuvwxyz}
  DATABASE_URL: postgresql://${DEV_POSTGRES_USER:-joutak}:${DEV_POSTGRES_PASSWORD:-joutak}@db:5432/${DEV_POSTGRES_DB:-joutak}
  DB_SSL_REQUIRED: "false"
  DB_CONN_MAX_AGE: "0"

  USE_X_FORWARDED_PROTO: "false"
  SECURE_SSL_REDIRECT: "false"
  SECURE_HSTS_SECONDS: "0"
  SESSION_COOKIE_SECURE: "false"
  CSRF_COOKIE_SECURE: "false"
  JWT_REFRESH_COOKIE_SECURE: "false"
  SESSION_COOKIE_SAMESITE: Lax
  CSRF_COOKIE_SAMESITE: Lax
  JWT_REFRESH_COOKIE_SAMESITE: Lax

  DJANGO_ALLOWED_HOSTS: ${DEV_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,joutak.localhost,api.localhost,admin.localhost}
  DJANGO_ADMIN_HOSTS: ${DEV_DJANGO_ADMIN_HOSTS:-admin.localhost}
  DJANGO_API_HOSTS: ${DEV_DJANGO_API_HOSTS:-api.localhost}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DEV_DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:5173,http://joutak.localhost,http://api.localhost,http://api.localhost:8000,http://admin.localhost,http://admin.localhost:8000}
  CORS_ALLOW_ALL_ORIGINS: ${DEV_CORS_ALLOW_ALL_ORIGINS:-true}
  FRONTEND_BASE_URL: ${DEV_FRONTEND_BASE_URL:-http://localhost:5173}
  DJANGO_SITE_DOMAIN: ${DEV_DJANGO_SITE_DOMAIN:-localhost}
  DJANGO_SITE_NAME: ${DEV_DJANGO_SITE_NAME:-JouTak Development}

  ACCOUNT_TRUST_PROXY_HEADERS: "false"
  MFA_WEBAUTHN_ALLOW_INSECURE_ORIGIN: "true"
  MFA_ENCRYPTION_KEYS: ${DEV_MFA_ENCRYPTION_KEYS:-}
  AUTH_SESSION_RETENTION_DAYS: ${DEV_AUTH_SESSION_RETENTION_DAYS:-30}
  AUTH_TOKEN_RETENTION_DAYS: ${DEV_AUTH_TOKEN_RETENTION_DAYS:-30}

  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  DEFAULT_FROM_EMAIL: ${DEV_DEFAULT_FROM_EMAIL:-dev@localhost}
  MEDIA_ROOT: /app/media

  OTEL_SERVICE_NAME: ${DEV_OTEL_SERVICE_NAME:-joutak-backend-dev}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${DEV_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${DEV_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${DEV_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
  OTEL_METRICS_EXPORT_INTERVAL_MS: ${DEV_OTEL_METRICS_EXPORT_INTERVAL_MS:-60000}

  # The backend entrypoint owns the idempotent development bootstrap.
  DJANGO_MIGRATE: "1"
  DJANGO_SYNC_SITE: "1"
  DJANGO_SYNC_EMAIL_ADDRESSES: "1"
  DJANGO_REENCRYPT_MFA_AUTHENTICATORS: "0"
  DJANGO_COLLECTSTATIC: "0"
  DJANGO_CHECK_DEPLOY: "0"
  DJANGO_CHECK_DEPLOY_STRICT: "0"

services:
  proxy:
    image: nginx:1.31-alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-80}:80"
    volumes:
      - ./local-proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - joutak_net

  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-joutak}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-joutak}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-joutak}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - joutak_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    working_dir: /app/backend
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-8000}:8000"
    environment: *backend-environment
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; assert os.access('/app/media', os.W_OK); urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ./backend:/app/backend:ro
      - media_data:/app/media
    networks:
      - joutak_net

  backend-maintenance:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /app/backend
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["python", "manage.py", "run_auth_maintenance"]
    environment: *backend-environment
    volumes:
      - ./backend:/app/backend:ro
    networks:
      - joutak_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DEV_BACKEND_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: ${DEV_CHOKIDAR_USEPOLLING:-false}
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      # Mount only live-editable inputs. Dependencies stay in the image, so a
      # normal `docker compose up --build` cannot reuse a stale node_modules.
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
      - ./contracts/page-document.schema.json:/contracts/page-document.schema.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - joutak_net

networks:
  joutak_net:
    driver: bridge

volumes:
  postgres_data:
  media_data:
