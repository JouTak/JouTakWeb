resolver 127.0.0.11 ipv6=off valid=30s;

server {
    listen 80;
    server_name localhost joutak.localhost;

    # Mirror the production same-origin router. Passing proxy_pass without a
    # URI keeps the complete browser-visible path (there is no StripPrefix).
    # Admin paths intentionally reach Django so HostRoutingMiddleware can
    # return a fail-closed 403 instead of the frontend SPA fallback.
    location ~ ^/(?:(?:api|bff|accounts|media|admin)(?:/|$)|static/admin(?:/|$)|health/?$) {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        # Preserve an explicitly published development port. The admin
        # same-origin guard compares this authority with the browser Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream frontend:5173;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        # Preserve host:port for exact Origin/CSRF/WebAuthn validation.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name api.localhost admin.localhost;

    location / {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        # Preserve host:port for exact Origin/CSRF/WebAuthn validation.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
